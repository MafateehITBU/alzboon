name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_ROOT=/var/www/alzboon
            export DEPLOY_BRANCH=main
            export DEPLOY_REPO_URL='${{ secrets.DEPLOY_REPO_URL }}'
            export APP_PORT=3001

            if [[ ! -x "$APP_ROOT/shared/bin/deploy-release.sh" ]]; then
              echo "Install scripts/deploy-release.sh to $APP_ROOT/shared/bin/deploy-release.sh on the VPS first."
              exit 1
            fi

            "$APP_ROOT/shared/bin/deploy-release.sh"
